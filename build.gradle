plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}

version = '0.1.0-SNAPSHOT'
group = 'dev.hypercore'

base {
    archivesName = 'hypercore'
}

def devModDirectory = layout.buildDirectory.dir('dev-mod/hypercore')
def generatedShaderResources = layout.buildDirectory.dir('generated-resources/shaders')
def lwjglVersion = '3.3.3'
def operatingSystem = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def architecture = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def lwjglNatives = operatingSystem.contains('win')
    ? (architecture.contains('aarch64') || architecture.contains('arm64') ? 'natives-windows-arm64' : 'natives-windows')
    : operatingSystem.contains('mac')
        ? (architecture.contains('aarch64') || architecture.contains('arm64') ? 'natives-macos-arm64' : 'natives-macos')
        : (architecture.contains('aarch64') || architecture.contains('arm64') ? 'natives-linux-arm64' : 'natives-linux')

sourceSets {
    devMod {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        output.dir(devModDirectory)
    }
    shaderCompiler {
        resources.setSrcDirs([])
    }
    vector {
        // Compiled against the live JDK 21 toolchain with the jdk.incubator.vector
        // module added explicitly (see compileVectorJava). Intentionally does NOT
        // use --release, which excludes incubator modules from the symbol image.
        java.setSrcDirs(['src/vector/java'])
        resources.setSrcDirs([])
    }
}

sourceSets.main.runtimeClasspath = configurations.runtimeClasspath + files(devModDirectory)

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.enabledGameTestNamespaces', 'hypercore'
            // Make the jdk.incubator.vector module available so the runtime can
            // select the cpu-vector backend; if the module is unavailable the
            // selector falls back to cpu-scalar, so this is safe to set unconditionally.
            jvmArgs '--add-modules', 'jdk.incubator.vector'
            mods {
                hypercore {
                    source sourceSets.devMod
                }
            }
        }

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

jarJar.register()

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.1-52.1.16')
    implementation(jarJar("org.lwjgl:lwjgl-vulkan:${lwjglVersion}")) {
        transitive = false
    }
    compileOnly 'com.github.oshi:oshi-core:6.4.10'
    shaderCompilerImplementation "org.lwjgl:lwjgl:${lwjglVersion}"
    shaderCompilerImplementation "org.lwjgl:lwjgl-shaderc:${lwjglVersion}"
    shaderCompilerRuntimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:${lwjglNatives}"
    shaderCompilerRuntimeOnly "org.lwjgl:lwjgl-shaderc:${lwjglVersion}:${lwjglNatives}"
    // The vector backend implements SpatialComputeBackend (main) and the benchmark
    // and tests reference it directly. Main itself never references the vector class
    // at compile time (it is loaded reflectively), so this stays a one-way dependency
    // and preserves --release 21 on the main source set.
    vectorImplementation sourceSets.main.output
    testImplementation sourceSets.vector.output
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (name != 'compileVectorJava') {
        options.release = 21
    }
}

// The Java Vector API ships as the jdk.incubator.vector incubator module. It is
// not visible under --release (incubator modules are excluded from the release
// symbol image), so the vector source set is compiled against the live JDK 21
// toolchain with the module added explicitly. Main never references the vector
// class at compile time; it is loaded reflectively, so --release 21 is preserved
// for every other source set.
tasks.named('compileVectorJava', JavaCompile).configure {
    options.compilerArgs.addAll(['--add-modules', 'jdk.incubator.vector'])
    dependsOn tasks.named('classes')
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    jvmArgs('--add-modules', 'jdk.incubator.vector')
}

tasks.register('compileComputeShaders', JavaExec) {
    dependsOn tasks.named('shaderCompilerClasses')
    classpath = sourceSets.shaderCompiler.runtimeClasspath
    mainClass = 'dev.hypercore.tools.ComputeShaderCompiler'
    args(
        layout.projectDirectory.file('src/main/shaders/squared_distances.comp').asFile.absolutePath,
        generatedShaderResources.get().file('assets/hypercore/shaders/squared_distances.spv').asFile.absolutePath
    )
    inputs.file layout.projectDirectory.file('src/main/shaders/squared_distances.comp')
    outputs.file generatedShaderResources.map {
        it.file('assets/hypercore/shaders/squared_distances.spv')
    }
}

tasks.register('compileRadiusMaskShader', JavaExec) {
    dependsOn tasks.named('shaderCompilerClasses')
    classpath = sourceSets.shaderCompiler.runtimeClasspath
    mainClass = 'dev.hypercore.tools.ComputeShaderCompiler'
    args(
        layout.projectDirectory.file('src/main/shaders/radius_mask.comp').asFile.absolutePath,
        generatedShaderResources.get().file('assets/hypercore/shaders/radius_mask.spv').asFile.absolutePath
    )
    inputs.file layout.projectDirectory.file('src/main/shaders/radius_mask.comp')
    outputs.file generatedShaderResources.map {
        it.file('assets/hypercore/shaders/radius_mask.spv')
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('compileComputeShaders')
    dependsOn tasks.named('compileRadiusMaskShader')
    from generatedShaderResources
}

tasks.register('prepareDevMod', Sync) {
    dependsOn tasks.named('classes')
    dependsOn tasks.named('compileVectorJava')
    from layout.buildDirectory.dir('classes/java/main')
    from layout.buildDirectory.dir('resources/main')
    from sourceSets.vector.output
    into devModDirectory
}

tasks.matching { it.name == 'runServer' || it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('prepareDevMod')
}

tasks.register('benchmarkCompute', JavaExec) {
    dependsOn tasks.named('classes')
    dependsOn tasks.named('compileVectorJava')
    classpath = sourceSets.main.output + sourceSets.vector.output + configurations.runtimeClasspath
    mainClass = 'dev.hypercore.compute.ComputeBenchmarkMain'
    args(layout.buildDirectory.file('reports/hypercore/compute-benchmark.md').get().asFile.absolutePath)
    jvmArgs('--add-modules', 'jdk.incubator.vector')
    outputs.upToDateWhen { false }
}

jar {
    from sourceSets.vector.output
    manifest {
        attributes([
            'Specification-Title'   : 'HyperCore',
            'Specification-Vendor'  : 'HyperCore',
            'Specification-Version' : project.version,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'HyperCore'
        ])
    }
}
