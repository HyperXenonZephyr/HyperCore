// HyperCore Fabric adapter.
//
// fabric-loom 1.12.1 builds the loader-specific mod JAR. The loader-agnostic
// runtime lives in :core and is consumed as a plain Java library
// (`implementation project(':core')`) — core has no Minecraft references, so it
// needs no remapping and no `namedElements`. The production mod JAR bundles
// :core's main + vector output directly (like the Forge subproject) so the
// single jar is self-contained; lwjgl-vulkan is bundled the same way instead of
// jar-in-jar to match the Forge packaging.

plugins {
    id 'java'
    id 'fabric-loom' version "${fabricLoomVersion}"
}

version = rootProject.findProperty('hypercoreVersion') ?: '0.1.0-SNAPSHOT'
group = 'dev.hypercore'

base {
    archivesName = 'hypercore-fabric'
}

def devModDirectory = layout.buildDirectory.dir('dev-mod/hypercore')
def lwjglVersion = rootProject.lwjglVersion

sourceSets {
    // Aggregated mod content for dev runs. Loom loads the hypercore mod from
    // this source set; prepareDevMod populates it by merging :core (main classes,
    // main resources including compiled .spv shaders, and vector output) with
    // this project's main classes/resources. The LWJGL core jar is also unpacked
    // here so the server-side mod classloader can resolve org.lwjgl.system.Configuration
    // alongside the included lwjgl-vulkan classes.
    devMod {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        output.dir(devModDirectory)
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The dev-mod directory must be on the JVM runtime classpath so the parent
// classloader can resolve :core classes (e.g. RegionTickTask) referenced by
// HyperCoreFabric. Without this, the parent classloader loads HyperCoreFabric
// from the main source set output but cannot find :core classes (compileOnly),
// causing ClassNotFoundException. The KnotClassLoader also has the dev-mod
// directory, but parent-first delegation means the parent must be able to
// resolve all references. This mirrors the Forge subproject's approach.
sourceSets.main.runtimeClasspath = configurations.runtimeClasspath + files(devModDirectory)

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabricApiVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:${rootProject.fabricGametestApiVersion}"

    // core is a plain Java library (no Minecraft, no remap). It is compile-only
    // here because prepareDevMod merges its classes/resources into the devMod
    // source set for dev runs; the production jar bundles them via `jar { from ... }`.
    compileOnly project(':core')

    // OSHI/JNA are compile-only; Minecraft ships them at runtime. :core also
    // declares them compileOnly, so this mirrors core.
    compileOnly 'com.github.oshi:oshi-core:6.4.10'
    compileOnly 'net.java.dev.jna:jna:5.13.0'
    compileOnly 'net.java.dev.jna:jna-platform:5.13.0'

    // LWJGL Vulkan: compile against it, bundle the native into the mod jar so a
    // server without a Vulkan SDK can still load the compute backend.
    implementation "org.lwjgl:lwjgl-vulkan:${lwjglVersion}"
    include "org.lwjgl:lwjgl-vulkan:${lwjglVersion}"

    // LWJGL core (MemoryStack/MemoryUtil/Configuration) is bundled by Minecraft in
    // production but must be declared explicitly so the Fabric mod classloader can
    // resolve it during dev runs and in the packaged mod.
    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    include "org.lwjgl:lwjgl:${lwjglVersion}"

    // SnakeYAML: bundled via Loom include so the Bukkit plugin.yml parser works
    // at runtime without a separate install.
    implementation "org.yaml:snakeyaml:2.3"
    include "org.yaml:snakeyaml:2.3"

    // The vector backend (core's vector source set) is loaded reflectively and is
    // not part of :core's runtimeElements, so add it to the dev-run classpath
    // explicitly. Use classesDirs only because the vector source set has no resources.
    // The production jar picks it up via the `jar { from ... }` below.
    runtimeOnly files(project(':core').sourceSets.vector.output.classesDirs)

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        server {
            runDir = "run"
            // Make the jdk.incubator.vector module available so the runtime can
            // select the cpu-vector backend; if it is unavailable the selector
            // falls back to cpu-scalar, so this is safe to set unconditionally.
            vmArg "--add-modules"
            vmArg "jdk.incubator.vector"
        }
        gameTestServer {
            runDir = "run"
            server()
            // Fabric's GameTest mixins enable test-server mode when this system
            // property is present and skip the EULA / server.properties checks.
            vmArg "-Dfabric-api.gametest"
            vmArg "--add-modules"
            vmArg "jdk.incubator.vector"
        }
    }

    mods {
        hypercore {
            sourceSet sourceSets.devMod
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Merges :core (main classes + main resources incl. compiled .spv + vector
// output) with this project's main classes/resources into the dev-mod directory
// Loom loads as the hypercore mod. Every class/resource the runtime reaches at
// dev time must land here, otherwise server runs fail with ClassNotFoundException
// or missing shader. The LWJGL core jar is also unpacked so the server-side mod
// classloader can resolve org.lwjgl.system.Configuration alongside lwjgl-vulkan.
tasks.register('prepareDevMod', Sync) {
    dependsOn project(':core').tasks.named('classes')
    dependsOn project(':core').tasks.named('processResources')
    dependsOn project(':core').tasks.named('compileVectorJava')
    dependsOn tasks.named('classes')
    dependsOn tasks.named('processResources')

    from project(':core').layout.buildDirectory.dir('classes/java/main')
    from project(':core').layout.buildDirectory.dir('resources/main')
    from project(':core').sourceSets.vector.output.classesDirs
    from layout.buildDirectory.dir('classes/java/main')
    from layout.buildDirectory.dir('resources/main')
    into devModDirectory

    doLast {
        def lwjglCore = configurations.runtimeClasspath.find { it.name == "lwjgl-${lwjglVersion}.jar" }
        if (lwjglCore != null) {
            copy {
                from zipTree(lwjglCore)
                into devModDirectory
            }
        }
    }
}

// Copy the dedicated-server GameTest Bukkit plugin into run/plugins so the
// external plugin loader discovers it during runServer/runGameTestServer.
def gametestPluginJarTask = project(':core').tasks.named('gametestPluginJar')
tasks.register('prepareGametestPlugins', Copy) {
    dependsOn gametestPluginJarTask
    from gametestPluginJarTask.get().archiveFile
    into layout.projectDirectory.dir('run/plugins')
}

tasks.matching { it.name == 'runServer' || it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('prepareDevMod')
    dependsOn tasks.named('prepareGametestPlugins')
}

// Copies the mod JAR and the GameTest Bukkit plugin into a host template that
// the root assembleDistribution task collects into the unified distribution.
tasks.register('prepareHostTemplate', Copy) {
    group = 'distribution'
    description = 'Prepares the Fabric host template for the unified distribution.'
    dependsOn tasks.named('remapJar')
    dependsOn gametestPluginJarTask
    from tasks.named('remapJar').flatMap { it.archiveFile }
    into layout.buildDirectory.dir('host-template/mods')
    from gametestPluginJarTask.flatMap { it.archiveFile }
    into layout.buildDirectory.dir('host-template/plugins')
}

// Expand the mod version into fabric.mod.json.
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// Production mod JAR: bundle :core's main + vector output alongside fabric main
// so the single mod JAR is self-contained. :core is pure Java with no Minecraft
// references, so its classes pass through loom's remap step unchanged. The .spv
// shaders ride along in :core's main resources.
jar {
    from sourceSets.main.output
    from project(':core').sourceSets.main.output
    from project(':core').sourceSets.vector.output
    manifest {
        attributes([
            'Specification-Title'   : 'HyperCore',
            'Specification-Vendor'  : 'HyperCore',
            'Specification-Version' : project.version,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'HyperCore'
        ])
    }
}
