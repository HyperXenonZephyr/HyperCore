# HyperCore Fabric configuration.
# Mirrors the ForgeConfigSpec defaults; every key is optional and falls back to
# the value shown here. HyperCoreSettings validates the assembled values.

# Worker threads for isolated asynchronous work. 0 reserves one logical processor automatically.
execution.workerThreads=0
# Maximum queued asynchronous tasks. 0 selects 64 tasks per worker with a minimum of 256.
execution.queueCapacity=0
# Number of recent server ticks retained for latency diagnostics.
metrics.tickSampleWindow=200

# Probe graphics adapters during server startup. Probe failures never prevent startup.
compute.probeGpu=true
# Enable the Vulkan compute backend when initialization and correctness self-tests succeed.
compute.enableGpu=true
# Minimum element count eligible for Vulkan compute offload.
compute.gpuMinimumBatchSize=16384
# CPU spatial compute backend: auto (vector when available, else scalar) | scalar | vector
compute.cpuBackend=auto
