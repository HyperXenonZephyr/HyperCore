org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# ForgeGradle 7 currently produces incomplete clean-build outputs when Gradle's
# configuration cache restores merged source-set state. Keep it disabled until
# the toolchain can reproduce a complete JAR with it enabled.
org.gradle.configuration-cache=false

net.minecraftforge.gradle.merge-source-sets=true
