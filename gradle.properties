org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Multi-project (core/forge/fabric) build: configure-on-demand can leave :core
# tasks unconfigured before :forge/:fabric dependents resolve them.
org.gradle.configureondemand=false

# ForgeGradle 7 currently produces incomplete clean-build outputs when Gradle's
# configuration cache restores merged source-set state. Keep it disabled until
# the toolchain can reproduce a complete JAR with it enabled.
org.gradle.configuration-cache=false

# The merged output path can omit unchanged classes after `clean` on the
# current ForgeGradle/Gradle combination. Standard source-set outputs are
# slower to configure but reproducible.
net.minecraftforge.gradle.merge-source-sets=false

# Shared versions consumed by the core/forge/fabric subprojects.
minecraftVersion=1.21.1
forgeVersion=52.1.16
forgegradlePluginVersion=[7.0.3,8)
fabricLoaderVersion=0.16.9
# Verified against https://fabricmc.net/develop/ (select 1.21.1) at fabric build time.
fabricApiVersion=0.115.1+1.21.1
fabricGametestApiVersion=2.0.5+6fc22b9919
# fabric-loom: 1.13-1.16 do not exist on maven.fabricmc.net; 1.12.1 is the
# latest stable release (contemporaneous with Gradle 9.3.1). 1.17-SNAPSHOT targets
# newer Minecraft (26.x). Verified against the Fabric maven at build time.
fabricLoomVersion=1.12.1
lwjglVersion=3.3.3
